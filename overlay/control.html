<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OPEN CLOWK</title>
<link rel="stylesheet" href="control.css">
</head>
<body>
  <div id="card">
    <div class="card-title">OPEN CLOWK</div>
    <p id="card-line">You've been coding for 30 minutes straight.</p>

    <div id="countdown" hidden></div>

    <div id="actions" class="card-buttons">
      <button id="btn-break">Take a break 🌱</button>
      <button id="btn-ignore">Ignore 🙄</button>
      <button id="btn-shutdown">Shut down ✕</button>
    </div>

    <div id="break-actions" class="card-buttons" hidden>
      <button id="btn-resume">Resume now</button>
    </div>
  </div>

  <script src="control.js"></script>
</body>
</html>
